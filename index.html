<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Varun Sathi</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --accent: #06b6d4;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --text-secondary: #64748b;
      --border: #e2e8f0;
      --radius: 16px;
      --radius-lg: 24px;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
      --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
    }
    
    * {
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      background-attachment: fixed;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      min-height: 100vh;
    }
    
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('data:image/svg+xml,<svg width="60" height="60" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="url(%23grid)"/></svg>');
      pointer-events: none;
      z-index: 0;
    }
    
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 16px 32px;
      box-shadow: var(--shadow-lg);
      position: sticky;
      top: 0;
      z-index: 99;
      border-bottom: 1px solid var(--border);
    }
    
    .navbar-title {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.2s ease;
    }
    
    .navbar-title:hover {
      transform: scale(1.05);
    }
    
    .navbar-links {
      display: flex;
      gap: 8px;
    }
    
    .navbar a {
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
      font-size: 15px;
      padding: 10px 18px;
      border-radius: 12px;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    
    .navbar a:hover {
      background: var(--primary);
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    
    .section {
      display: none;
      padding: 60px 24px;
      max-width: 800px;
      margin: auto;
      position: relative;
      z-index: 1;
      animation: fadeIn 0.5s ease;
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .active {
      display: block;
    }
    
    .hero-title {
      text-align: center;
      color: white;
      font-size: 56px;
      font-weight: 900;
      margin: 0;
      letter-spacing: -1px;
      line-height: 1.2;
      text-shadow: 0 2px 40px rgba(0,0,0,0.3);
    }
    
    .hero-subtitle {
      text-align: center;
      color: rgba(255,255,255,0.95);
      font-size: 20px;
      margin-top: 16px;
      font-weight: 500;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.6;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }
    
    .section-title {
      text-align: center;
      color: var(--card);
      font-size: 36px;
      font-weight: 800;
      margin-bottom: 32px;
      text-shadow: 0 2px 20px rgba(0,0,0,0.1);
    }
    
    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin: 40px 0;
    }
    
    .stat-card {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      padding: 24px;
      border-radius: var(--radius);
      text-align: center;
      box-shadow: var(--shadow-lg);
      transition: all 0.3s ease;
      border: 1px solid rgba(255,255,255,0.5);
    }
    
    .stat-card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    
    .stat-number {
      font-size: 32px;
      font-weight: 800;
      color: var(--primary);
      margin: 0;
    }
    
    .stat-label {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 8px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .home-buttons {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 50px;
      flex-wrap: wrap;
    }
    
    .home-btn {
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      color: #fff;
      padding: 18px 36px;
      font-size: 17px;
      font-weight: 700;
      border-radius: var(--radius);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
      transition: all 0.3s ease;
    }
    
    .home-btn:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 12px 30px rgba(37, 99, 235, 0.4);
    }
    
    .form-box {
      background: var(--card);
      padding: 36px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    
    .form-box:hover {
      transform: translateY(-4px);
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    }
    
    label {
      display: block;
      font-weight: 600;
      color: var(--text);
      margin-top: 18px;
      margin-bottom: 6px;
      font-size: 14px;
      letter-spacing: 0.3px;
    }
    
    input, select, textarea {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 2px solid var(--border);
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s ease;
      background: var(--bg);
    }
    
    input:focus, select:focus, textarea:focus {
      outline: none;
      border: 2px solid var(--primary);
      background: white;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
      transform: translateY(-1px);
    }
    
    textarea {
      min-height: 120px;
      resize: vertical;
    }
    
    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      font-weight: 700;
      margin-top: 28px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.5);
    }
    
    .forum-item {
      background: var(--card);
      padding: 28px;
      margin-top: 24px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      border-left: 4px solid var(--primary);
      word-wrap: break-word;
      transition: all 0.3s ease;
      animation: slideIn 0.4s ease;
    }
    
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    
    .forum-item:hover {
      transform: translateX(8px);
      box-shadow: var(--shadow-lg);
      border-left-width: 6px;
    }
    
    .forum-item h3 {
      margin: 0 0 12px 0;
      color: var(--primary);
      font-size: 20px;
      font-weight: 700;
    }
    
    .forum-item p {
      margin: 8px 0;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    
    .forum-item p:last-child {
      color: var(--text);
      font-size: 15px;
      margin-top: 12px;
    }
    
    .forum-item strong {
      color: var(--text);
      font-weight: 600;
    }
    
    @media(max-width: 768px) {
      .navbar {
        padding: 14px 20px;
      }
      
      .navbar-title {
        font-size: 20px;
      }
      
      .navbar-links {
        gap: 4px;
      }
      
      .navbar a {
        font-size: 13px;
        padding: 8px 12px;
      }
      
      .hero-title {
        font-size: 36px;
      }
      
      .hero-subtitle {
        font-size: 16px;
        padding: 0 16px;
      }
      
      .section-title {
        font-size: 28px;
      }
      
      .section {
        padding: 40px 16px;
      }
      
      .home-buttons {
        flex-direction: column;
        gap: 16px;
        padding: 0 16px;
      }
      
      .home-btn {
        width: 100%;
        justify-content: center;
        padding: 16px 24px;
        font-size: 16px;
      }
      
      .form-box {
        padding: 24px 20px;
      }
      
      input, select, textarea {
        font-size: 16px;
      }
      
      button {
        font-size: 15px;
        padding: 14px;
      }
      
      .stats-container {
        grid-template-columns: 1fr;
        gap: 16px;
      }
    }
    
    @media(max-width: 480px) {
      .navbar {
        padding: 12px 16px;
      }
      
      .navbar-title {
        font-size: 18px;
      }
      
      .navbar a {
        font-size: 12px;
        padding: 6px 10px;
      }
      
      .hero-title {
        font-size: 32px;
      }
      
      .form-box {
        padding: 20px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="navbar-title" onclick="resetHome()">💧 Varun Sathi</div>
    <div class="navbar-links">
      <a onclick="show('home')">Home</a>
      <a onclick="show('complaint')">Complaint</a>
      <a onclick="show('forum')">Forum</a>
    </div>
  </div>

  <!-- HOME -->
  <div id="home" class="section active">
    <h1 class="hero-title">Welcome to Varun Sathi</h1>
    <p class="hero-subtitle">
      Community-driven water & drainage issue reporting platform for a cleaner, healthier tomorrow
    </p>
    
    <div class="stats-container">
      <div class="stat-card">
        <p class="stat-number" id="complaintCount">0</p>
        <p class="stat-label">Complaints Filed</p>
      </div>
      <div class="stat-card">
        <p class="stat-number" id="forumCount">0</p>
        <p class="stat-label">Forum Posts</p>
      </div>
      <div class="stat-card">
        <p class="stat-number">24/7</p>
        <p class="stat-label">Available</p>
      </div>
    </div>
    
    <div class="home-buttons">
      <div class="home-btn" onclick="show('complaint')">
        📝 Report a Problem
      </div>
      <div class="home-btn" onclick="show('forum')">
        💬 Open Forum
      </div>
    </div>
  </div>

  <!-- COMPLAINT -->
  <div id="complaint" class="section">
    <h2 class="section-title">Submit Complaint</h2>
    <div class="form-box">
      <form id="complaintForm">
        <label>Full Name</label>
        <input name="name" placeholder="Enter your name" required>
        
        <label>Phone Number</label>
        <input name="phone" type="tel" placeholder="+91 XXXXX XXXXX" required>
        
        <label>Address</label>
        <input name="address" placeholder="Street address" required>
        
        <label>City</label>
        <input name="city" placeholder="Your city" required>
        
        <label>State</label>
        <input name="state" placeholder="Your state" required>
        
        <label>Pincode</label>
        <input name="pin" type="number" placeholder="6-digit pincode" required>
        
        <label>Type of Problem</label>
        <select name="problem" required>
          <option value="">-- Select problem --</option>
          <option>💧 Less water flow</option>
          <option>🚰 Dirty water</option>
          <option>🌊 Drain overflow</option>
          <option>🚫 Clogged drain</option>
          <option>❓ Others</option>
        </select>
        
        <label>Additional Details</label>
        <textarea name="details" placeholder="Describe the issue in detail..."></textarea>
        
        <button type="submit">Submit Complaint</button>
      </form>
    </div>
  </div>

  <!-- FORUM -->
  <div id="forum" class="section">
    <h2 class="section-title">Public Forum</h2>
    <div class="form-box">
      <form id="forumForm">
        <label>Your Name</label>
        <input name="name" placeholder="Enter your name" required>
        
        <label>Location</label>
        <input name="location" placeholder="City, State" required>
        
        <label>Describe Your Problem</label>
        <textarea name="message" placeholder="Share your water or drainage issue with the community..." required></textarea>
        
        <button type="submit">Post to Forum</button>
      </form>
    </div>
    <div class="forum-list" id="forumList"></div>
  </div>

  <script>
    function show(id){
      document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      window.scrollTo({top: 0, behavior: 'smooth'});
    }
    
    function resetHome(){
      show('home');
    }
    
    function updateStats(){
      document.getElementById('complaintCount').textContent = forumData.length;
      document.getElementById('forumCount').textContent = forumData.length;
    }
    
    let forumData = [];
    
    // Forum submit
    const forumForm = document.getElementById("forumForm");
    forumForm.addEventListener("submit", e => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(forumForm).entries());
      forumData.push(data);
      renderForum();
      updateStats();
      forumForm.reset();
      
      // Success animation
      const btn = forumForm.querySelector('button');
      btn.textContent = '✓ Posted Successfully!';
      btn.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
      setTimeout(() => {
        btn.textContent = 'Post to Forum';
        btn.style.background = '';
      }, 2000);
    });
    
    function renderForum(){
      const list = document.getElementById("forumList");
      list.innerHTML = "";
      const reversed = [...forumData].reverse();
      reversed.forEach(f=>{
        list.innerHTML += `<div class="forum-item">
          <h3>${f.name}</h3>
          <p><strong>📍 Location:</strong> ${f.location}</p>
          <p>${f.message}</p>
        </div>`;
      });
    }
    
    // Complaint → Sheets + Forum
    const complaintForm = document.getElementById("complaintForm");
    complaintForm.addEventListener("submit", e => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(complaintForm).entries());
      
      fetch("https://script.google.com/macros/s/AKfycbyYXphQuCSBYYGQKQawzvK3juqA2V1DGoLo49XGn6F9fk_xeSLDlZLuGD8QyRxjHifH_w/exec", {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
      
      forumData.push({
        name: data.name,
        location: data.city + ", " + data.state,
        message: data.problem + " - " + (data.details || "No details provided")
      });
      
      renderForum();
      updateStats();
      
      // Success animation
      const btn = complaintForm.querySelector('button');
      btn.textContent = '✓ Complaint Submitted!';
      btn.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
      
      setTimeout(() => {
        btn.textContent = 'Submit Complaint';
        btn.style.background = '';
        complaintForm.reset();
        show('forum');
      }, 2000);
    });
  </script>
</body>
</html>
