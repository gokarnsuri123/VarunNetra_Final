<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Varun Sathi</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
:root{
  --primary:#1a73e8;
  --bg:#fafafa;
  --card:#fff;
  --radius:16px;
  --shadow:0 4px 14px rgba(0,0,0,.06);
}

body{margin:0;font-family:Inter,Arial;background:var(--bg);}

.navbar{
  display:flex;justify-content:space-between;
  padding:14px 24px;background:var(--card);
  box-shadow:var(--shadow);
  position:sticky;top:0;z-index:99;
}
.navbar-title{font-weight:700;color:var(--primary);cursor:pointer}
.navbar a{margin-left:18px;cursor:pointer;font-weight:600}

.section{display:none;max-width:900px;margin:auto;padding:30px}
.active{display:block}

.form-box{
  background:var(--card);padding:24px;
  border-radius:var(--radius);box-shadow:var(--shadow)
}

input,select,textarea{
  width:100%;padding:12px;margin-top:8px;
  border-radius:10px;border:1px solid #ccc
}

button{
  margin-top:18px;padding:14px;width:100%;
  border:none;border-radius:12px;
  background:#111;color:#fff;font-weight:600
}

.forum-item{
  background:var(--card);margin-top:16px;
  padding:16px;border-radius:var(--radius);box-shadow:var(--shadow)
}

#map{
  height:420px;border-radius:16px;
  box-shadow:var(--shadow)
}

.radio-row{
  display:flex;gap:20px;margin-top:10px;font-size:14px
}

.location-box{margin-top:10px}

.suggestions{
  background:#fff;border:1px solid #ddd;
  border-radius:10px;max-height:180px;
  overflow-y:auto;position:relative;z-index:999
}
.suggestions div{
  padding:10px;cursor:pointer
}
.suggestions div:hover{background:#f1f1f1}
</style>
</head>

<body>

<div class="navbar">
  <div class="navbar-title" onclick="show('home')">Varun Sathi</div>
  <div>
    <a onclick="show('home')">Home</a>
    <a onclick="show('complaint')">Complaint</a>
    <a onclick="show('forum')">Forum</a>
    <a onclick="show('mapView')">Map</a>
  </div>
</div>

<!-- HOME -->
<div id="home" class="section active">
  <h1 style="text-align:center;color:var(--primary)">
    Community Water Issue Reporting
  </h1>
</div>

<!-- COMPLAINT -->
<div id="complaint" class="section">
<h2>Submit Complaint</h2>
<div class="form-box">
<form id="complaintForm">

<input name="name" placeholder="Name" required>
<input name="phone" placeholder="Phone" required>
<input name="address" placeholder="Address" required>
<input name="city" placeholder="City" required>
<input name="state" placeholder="State" required>

<select name="problem" required>
  <option value="">Select problem</option>
  <option>Less water flow</option>
  <option>Dirty water</option>
  <option>Drain overflow</option>
  <option>Clogged drain</option>
  <option>Others</option>
</select>

<textarea name="details" placeholder="Details"></textarea>

<div class="radio-row">
  <label><input type="radio" name="locTypeC" value="gps" checked> Use GPS</label>
  <label><input type="radio" name="locTypeC" value="manual"> Enter Location</label>
</div>

<div class="location-box" id="manualC" style="display:none;">
  <input type="text" id="locSearchC" placeholder="Search location">
  <div class="suggestions" id="sugC"></div>
</div>

<input type="hidden" name="lat">
<input type="hidden" name="lng">

<button>Submit Complaint</button>
</form>
</div>
</div>

<!-- FORUM -->
<div id="forum" class="section">
<h2>Public Forum</h2>

<div class="form-box">
<form id="forumForm">

<input name="name" placeholder="Name" required>
<input name="location" placeholder="Location description" required>
<textarea name="message" placeholder="Issue" required></textarea>

<div class="radio-row">
  <label><input type="radio" name="locTypeF" value="gps" checked> Use GPS</label>
  <label><input type="radio" name="locTypeF" value="manual"> Enter Location</label>
</div>

<div class="location-box" id="manualF" style="display:none;">
  <input type="text" id="locSearchF" placeholder="Search location">
  <div class="suggestions" id="sugF"></div>
</div>

<input type="hidden" name="lat">
<input type="hidden" name="lng">

<button>Post to Forum</button>
</form>
</div>

<div id="forumList"></div>
</div>

<!-- MAP -->
<div id="mapView" class="section">
<h2>Issue Density Map</h2>
<div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
let forumData=[];
let map,markers=[],circles=[];

/* ===== NAV ===== */
function show(id){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==="mapView") setTimeout(renderMap,200);
}

/* ===== GPS ===== */
function getGPS(cb){
  navigator.geolocation.getCurrentPosition(
    p=>cb(p.coords.latitude,p.coords.longitude),
    ()=>alert("GPS permission required")
  );
}

/* ===== Toggle Manual/GPS ===== */
document.querySelectorAll("input[name='locTypeC']").forEach(r=>{
  r.onchange=()=>manualC.style.display=r.value==="manual"?"block":"none";
});
document.querySelectorAll("input[name='locTypeF']").forEach(r=>{
  r.onchange=()=>manualF.style.display=r.value==="manual"?"block":"none";
});

/* ===== AUTOCOMPLETE ===== */
function autoComplete(input,sug,cb){
  input.oninput=async()=>{
    if(input.value.length<3){sug.innerHTML="";return;}
    const res=await fetch(
      `https://nominatim.openstreetmap.org/search?format=json&q=${input.value}`
    );
    const data=await res.json();
    sug.innerHTML="";
    data.slice(0,5).forEach(p=>{
      const d=document.createElement("div");
      d.textContent=p.display_name;
      d.onclick=()=>{
        input.value=p.display_name;
        sug.innerHTML="";
        cb(p.lat,p.lon);
      };
      sug.appendChild(d);
    });
  };
}

autoComplete(locSearchC,sugC,(lat,lng)=>{
  complaintForm.lat.value=lat;
  complaintForm.lng.value=lng;
});

autoComplete(locSearchF,sugF,(lat,lng)=>{
  forumForm.lat.value=lat;
  forumForm.lng.value=lng;
});

/* ===== FORUM SUBMIT ===== */
forumForm.onsubmit=e=>{
  e.preventDefault();
  const manual=document.querySelector("input[name='locTypeF']:checked").value==="manual";

  const save=(lat,lng)=>{
    const d=Object.fromEntries(new FormData(forumForm));
    d.lat=lat; d.lng=lng;
    forumData.push(d);
    renderForum();
    forumForm.reset();
  };

  manual ? save(forumForm.lat.value,forumForm.lng.value) : getGPS(save);
};

/* ===== COMPLAINT SUBMIT ===== */
complaintForm.onsubmit=e=>{
  e.preventDefault();
  const manual=document.querySelector("input[name='locTypeC']:checked").value==="manual";

  const save=(lat,lng)=>{
    const d=Object.fromEntries(new FormData(complaintForm));
    forumData.push({
      name:d.name,
      location:d.city+", "+d.state,
      message:d.problem+" - "+(d.details||""),
      lat,lng
    });
    alert("Complaint submitted successfully");
    complaintForm.reset();
  };

  manual ? save(complaintForm.lat.value,complaintForm.lng.value) : getGPS(save);
};

/* ===== FORUM RENDER ===== */
function renderForum(){
  forumList.innerHTML="";
  forumData.forEach(f=>{
    forumList.innerHTML+=`
    <div class="forum-item">
      <b>${f.name}</b><br>
      ${f.location}<br>${f.message}
    </div>`;
  });
}

/* ===== MAP ===== */
function renderMap(){
  if(!map){
    map=L.map('map').setView([28.61,77.23],10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  }

  markers.forEach(m=>map.removeLayer(m));
  circles.forEach(c=>map.removeLayer(c));
  markers=[];circles=[];

  forumData.forEach(f=>{
    const m=L.marker([f.lat,f.lng]).addTo(map)
      .bindPopup(`<b>${f.name}</b><br>${f.location}<br>${f.message}`);
    markers.push(m);
  });

  forumData.forEach(f=>{
    const count=forumData.filter(o=>
      Math.abs(o.lat-f.lat)<0.01 &&
      Math.abs(o.lng-f.lng)<0.01
    ).length;

    let color=count>5?"red":count>2?"orange":"green";

    circles.push(
      L.circle([f.lat,f.lng],{
        radius:300,color,fillOpacity:0.25
      }).addTo(map)
    );
  });
}
</script>

</body>
</html>
